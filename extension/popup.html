<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PostPilot AI</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <img src="icons/icon-48.png" alt="" class="logo" />
    <span class="brand">PostPilot<span class="brand-ai">AI</span></span>
  </div>

  <div id="status" class="status hidden"></div>

  <!-- Sign-in view -->
  <form id="login-form" class="view hidden">
    <label>Email</label>
    <input type="email" id="login-email" required autocomplete="email" />
    <label>Password</label>
    <input type="password" id="login-password" required autocomplete="current-password" />
    <button type="submit" id="login-submit" class="btn-primary">Sign in</button>
    <p class="hint">Use your normal PostPilot AI account — works on every plan.</p>
  </form>

  <!-- Capture view -->
  <form id="capture-form" class="view hidden">
    <div class="row-between">
      <label>Platform</label>
      <button type="button" id="signout" class="link-btn">Sign out</button>
    </div>
    <select id="platform">
      <option value="instagram">Instagram</option>
      <option value="linkedin">LinkedIn</option>
      <option value="twitter">Twitter / X</option>
      <option value="facebook">Facebook</option>
      <option value="threads">Threads</option>
      <option value="bluesky">Bluesky</option>
      <option value="pinterest">Pinterest</option>
    </select>
    <label>Content</label>
    <textarea id="content" rows="6" placeholder="Select text on a page, or paste it here…"></textarea>
    <label>Topic <span class="optional">(optional)</span></label>
    <input type="text" id="topic" placeholder="e.g. Q3 product launch" />
    <button type="submit" id="save-submit" class="btn-primary">Save to Drafts</button>
  </form>

  <script src="popup.js" type="module"></script>
</body>
</html>
